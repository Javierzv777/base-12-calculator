[package]
name = "dz-gui"
version = "0.1.0"
edition = "2021"
authors = ["Investigacion Base 12"]
description = "Dozenal (base 12) calculator built from 12-valued logic gates"
license = "Apache-2.0"

# Deliberately its own workspace, not a member of the root one: the core
# crates must keep building and testing in seconds without dragging in
# Tauri's dependency tree. The only link between the two is the `dz-api`
# path dependency below -- the same entry point the CLI uses.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Phase 7: the research panel exports CSV to a real file. `plugin-dialog`
# supplies the native "Save as" dialog; `plugin-fs` owns the filesystem
# capability the app declares (see `capabilities/default.json`) and is what
# the chosen path is registered against, so a future frontend-side read of
# an exported file is already in scope. The bytes themselves are written by
# `commands::export_csv` in Rust, because Rust is the only authority on the
# CSV format.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dz-api = { path = "../../crates/dz-api" }
